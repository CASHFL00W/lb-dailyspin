<!doctype html>
<!--
    Renders the README preview images from the app's demo mode.
    Example (Chrome):
    chrome --headless=new --allow-file-access-from-files --hide-scrollbars --window-size=1800,1060
           --virtual-time-budget=4000 --screenshot=docs/showcase.png docs/showcase.html
    Use ?set=light for the light-mode row.
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Daily Spins - Showcase</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
            color: #fff;
            background:
                radial-gradient(60% 50% at 20% 0%, rgba(255, 55, 95, 0.28), transparent 70%),
                radial-gradient(50% 50% at 90% 100%, rgba(255, 159, 10, 0.2), transparent 70%),
                #0b0b0e;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 34px;
            overflow: hidden;
        }
        header { text-align: center; }
        h1 { font-size: 46px; font-weight: 900; letter-spacing: -0.02em; }
        h1 span { background: linear-gradient(90deg, #ff375f, #ff9f0a); -webkit-background-clip: text; background-clip: text; color: transparent; }
        header p { margin-top: 6px; font-size: 18px; color: rgba(235, 235, 245, 0.6); }
        .row { display: flex; gap: 34px; }
        figure { display: flex; flex-direction: column; align-items: center; gap: 14px; }
        .phone {
            width: calc(390px * var(--s) + 20px);
            height: calc(844px * var(--s) + 20px);
            padding: 10px;
            border-radius: 52px;
            background: linear-gradient(145deg, #3a3a40, #121215);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.55), inset 0 0 0 1.5px rgba(255, 255, 255, 0.08);
        }
        .screen {
            position: relative;
            width: calc(390px * var(--s));
            height: calc(844px * var(--s));
            border-radius: 42px;
            overflow: hidden;
            background: #000;
        }
        .screen iframe {
            width: 390px; height: 844px; border: 0;
            transform: scale(var(--s)); transform-origin: 0 0;
        }
        .island {
            position: absolute; z-index: 2; top: 10px; left: 50%;
            width: 96px; height: 28px; margin-left: -48px;
            border-radius: 20px; background: #000;
        }
        figcaption { font-size: 15px; font-weight: 600; color: rgba(235, 235, 245, 0.7); }
    </style>
</head>
<body style="--s: 0.74">
    <header>
        <h1><span>Daily Spins</span> for lb-phone</h1>
        <p>Spin once a day - win cash or a daily mission</p>
    </header>
    <div class="row" id="row"></div>
    <script>
        const sets = {
            dark: [
                ['view=spin', 'Spin the wheel'],
                ['view=spin&result=jackpot', 'Win prizes'],
                ['view=mission', 'Daily missions'],
                ['view=history', 'Stats & history'],
            ],
            light: [
                ['view=spin&cooldown=1&theme=light', 'Daily cooldown'],
                ['view=spin&result=mission&theme=light', 'Mission prize'],
                ['view=mission&theme=light', 'Light mode'],
                ['view=history&theme=light', 'Follows the phone theme'],
            ],
        };
        const set = new URLSearchParams(location.search).get('set') || 'dark';
        document.getElementById('row').innerHTML = sets[set].map(([query, caption]) => `
            <figure>
                <div class="phone"><div class="screen"><div class="island"></div>
                    <iframe src="../ui/index.html?${query}&still=1"></iframe>
                </div></div>
                <figcaption>${caption}</figcaption>
            </figure>`).join('');
    </script>
</body>
</html>
